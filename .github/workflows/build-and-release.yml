name: Build & Release Sonic VANE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  build-and-release:
    name: Build Multi-Platform Packages & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS Assets
        run: |
          git lfs pull
          git lfs checkout
          git fetch --tags --force 2>/dev/null || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender zip unzip curl

      - name: Cache Godot Engine & Export Templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
            ~/.local/share/godot/templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Setup Godot Engine & Export Templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          GODOT_VER="${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}"
          echo "Downloading Godot $GODOT_VER..."

          # Download and install Godot Editor/CLI
          curl -L -f -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VER}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -rf godot.zip /tmp/godot

          # Download and install Export Templates
          echo "Downloading Export Templates for $GODOT_VER..."
          curl -L -f -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q templates.tpz -d /tmp/templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates/templates "$TEMPLATE_DIR"

          mkdir -p "$HOME/.local/share/godot/templates"
          ln -sf "$TEMPLATE_DIR" "$HOME/.local/share/godot/templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"

          rm -rf templates.tpz /tmp/templates

      - name: Verify Godot Installation
        run: |
          godot --version

      - name: Configure Godot Editor Settings (Blender Path)
        run: |
          mkdir -p "$HOME/.config/godot"
          echo '[gd_resource type="EditorSettings" format=3]' > "$HOME/.config/godot/editor_settings-4.7.tres"
          echo '' >> "$HOME/.config/godot/editor_settings-4.7.tres"
          echo '[resource]' >> "$HOME/.config/godot/editor_settings-4.7.tres"
          echo 'filesystem/import/blender/blender_path = "/usr/bin/blender"' >> "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Cache Godot Asset Imports
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-

      - name: Build & Package Sonic VANE
        run: |
          python3 scripts/build_game.py \
            --godot /usr/local/bin/godot \
            --project-dir . \
            --dist-dir dist

      - name: Generate Date Tag & Commit Changelog
        id: release_meta
        run: |
          # 1. Determine Date-Based Tag (e.g. 2026-10-09)
          DATE_TAG=$(date +'%Y-%m-%d')
          FINAL_TAG="${DATE_TAG}"
          RELEASE_TITLE="Sonic VANE - ${DATE_TAG}"

          # Handle multiple pushes on the same date gracefully
          if git rev-parse "refs/tags/${DATE_TAG}" >/dev/null 2>&1; then
            COUNTER=2
            while git rev-parse "refs/tags/${DATE_TAG}.${COUNTER}" >/dev/null 2>&1; do
              COUNTER=$((COUNTER + 1))
            done
            FINAL_TAG="${DATE_TAG}.${COUNTER}"
            RELEASE_TITLE="Sonic VANE - ${DATE_TAG} (Build ${COUNTER})"
          fi

          echo "tag_name=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          # 2. Generate Commit Changelog based on the push
          echo "## ${RELEASE_TITLE}" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          # If triggered by git push with multiple commits
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            COMMIT_COUNT=$(git rev-list --count "${BEFORE_SHA}..${AFTER_SHA}")
            echo "### Commits in this push (${COMMIT_COUNT}):" >> CHANGELOG.md
            git log --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" "${BEFORE_SHA}..${AFTER_SHA}" >> CHANGELOG.md
          else
            # Fallback for manual dispatch or force/initial pushes
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since \`${PREV_TAG}\`:" >> CHANGELOG.md
              git log --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" "${PREV_TAG}..HEAD" >> CHANGELOG.md
            else
              echo "### Recent Commits:" >> CHANGELOG.md
              git log --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" -n 25 >> CHANGELOG.md
            fi
          fi

          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "### Release Packages" >> CHANGELOG.md
          echo "* **Windows Desktop:** \`SonicVANE-Windows.zip\` (contains \`SonicVANE_WIN.exe\` + \`Data/\`)" >> CHANGELOG.md
          echo "* **Linux:** \`SonicVANE-Linux.zip\` (contains \`SonicVANE_LINUX.x86_64\` + \`Data/\`)" >> CHANGELOG.md
          echo "* **macOS:** \`SonicVANE-macOS.zip\` (contains \`SonicVANE_MAC.app\` + \`Data/\`)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Data Structure" >> CHANGELOG.md
          echo "\`Data/\` contains all base packs (\`audio.pck\`, \`characters.pck\`, \`objects.pck\`, \`shared.pck\`) and individual level packs inside \`Data/Levels/\`." >> CHANGELOG.md

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sonic-vane-packages
          path: dist/*.zip
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            dist/SonicVANE-Windows.zip
            dist/SonicVANE-Linux.zip
            dist/SonicVANE-macOS.zip
